<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ortokoll</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --hg: #14171c; --karte: #1d222a; --rand: #2b333e;
    --akzent: #8fc6ff; --text: #e9edf2; --text2: #9aa7b4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--hg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 20px 12px; display: flex; flex-wrap: wrap;
           align-items: baseline; gap: 12px; }
  header .titel { font-size: 28px; font-weight: 700; color: var(--akzent); }
  header .unter { color: var(--text2); font-size: 14px; }
  nav { margin-left: auto; display: flex; gap: 8px; }
  nav button { background: var(--karte); color: var(--text2);
    border: 1px solid var(--rand); border-radius: 10px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; }
  nav button.aktiv { color: var(--akzent); border-color: var(--akzent); }
  main { padding: 8px 20px 24px; }
  #filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 14px; position: sticky; top: 0; z-index: 1050;
    background: var(--hg); padding: 8px 0; }
  .fmenue { position: relative; }
  .fchip { background: var(--karte); color: var(--text);
    border: 1px solid var(--rand); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .fchip:hover { border-color: var(--akzent); }
  .fchip.aktiv { background: #16324b; color: var(--akzent); border-color: var(--akzent); }
  .fchip .pfeil { color: var(--text2); font-size: 11px; margin-left: 5px; }
  .fpanel { display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: var(--karte); border: 1px solid var(--rand); border-radius: 12px;
    padding: 8px; min-width: 160px; z-index: 1100;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
  .fpanel.offen { display: flex; flex-direction: column; gap: 2px; }
  .foption { background: none; border: none; color: var(--text); text-align: left;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .foption:hover { background: #232a33; }
  .foption.aktiv { color: var(--akzent); font-weight: 600; }
  .fzaehler { color: var(--text2); font-size: 13px; margin-left: auto; }
  .fleeren { background: none; border: 1px solid var(--rand); color: var(--text2);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .fleeren:hover { color: var(--akzent); border-color: var(--akzent); }
  .leer { color: var(--text2); text-align: center; padding: 60px 0; font-size: 15px; }
  .karte-eintrag { background: var(--karte); border: 1px solid var(--rand);
    border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .datum { font-weight: 700; font-size: 14px; }
  .adresse { color: var(--text2); font-size: 13px; margin-top: 2px; }
  .fotos { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
  .fotos img { width: 96px; height: 96px; object-fit: cover;
    border-radius: 10px; border: 1px solid var(--rand); }
  .angaben { margin-top: 10px; font-size: 13px; color: var(--text2); }
  .angaben b { color: var(--text); font-weight: 600; }
  .freitext { margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
  #inhalt { display: flex; flex-direction: column; gap: 14px; }
  #karte { display: none; }
  #map { height: calc(100vh - 200px); min-height: 320px;
    border-radius: 12px; border: 1px solid var(--rand); }
  @media (min-width: 900px) {
    nav { display: none; }
    #inhalt { flex-direction: row; align-items: flex-start; gap: 16px; }
    #liste { flex: 1 1 0; min-width: 0; }
    #karte { flex: 1 1 0; min-width: 0; position: sticky; top: 8px; }
    #map { height: calc(100vh - 200px); min-height: 420px; }
  }
  .leaflet-tile { filter: brightness(0.9) saturate(0.85); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--karte); color: var(--text); }
  .popup-fotos img { width: 100px; height: 100px; object-fit: cover;
    border-radius: 8px; margin: 6px 4px 0 0; }
  footer { text-align: center; color: var(--text2); font-size: 12px; padding: 12px; }
</style>
</head>
<body>
<header>
  <div class="titel">ortokoll</div>
  <div class="unter">Gemeldete Orte</div>
  <nav>
    <button id="btnListe" class="aktiv" onclick="zeige('liste')">Liste</button>
    <button id="btnKarte" onclick="zeige('karte')">Karte</button>
  </nav>
</header>
<main>
  <div id="filter" class="filterleiste" style="display:none"></div>
  <div id="inhalt">
    <div id="liste" class="leer">Lade Einträge…</div>
    <div id="karte"><div id="map"></div></div>
  </div>
</main>
<footer>Automatisch erzeugt aus dem ortokoll-Backup · Karte: OpenStreetMap</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let eintraege = [];
let karte = null;
const fragen = ["Leuchte", "Helligkeit", "Lichtfarbe"];
const antworten = [
  ["stimmt", "hässlich", "aha"],
  ["geblendet", "ok", "zappenduster"],
  ["weiß-blau", "grün", "rose"]
];
let filter = [null, null, null];
const desktop = window.matchMedia("(min-width: 900px)");
if (desktop.addEventListener) desktop.addEventListener("change", () => zeige());
else if (desktop.addListener) desktop.addListener(() => zeige());
let modus = "liste";
let karteAlt = false;

function zeige(was) {
  if (was === "liste" || was === "karte") modus = was;
  const beide = desktop.matches;
  const listeSichtbar = beide || modus === "liste";
  const karteSichtbar = beide || modus === "karte";
  document.getElementById("liste").style.display = listeSichtbar ? "block" : "none";
  document.getElementById("karte").style.display = karteSichtbar ? "block" : "none";
  document.getElementById("filter").style.display = eintraege.length > 0 ? "flex" : "none";
  document.getElementById("btnListe").className = modus === "liste" ? "aktiv" : "";
  document.getElementById("btnKarte").className = modus === "karte" ? "aktiv" : "";
  if (!beide) { try { history.replaceState(null, "", "#" + modus); } catch (e) {} }
  if (karteSichtbar && (!karte || karteAlt)) { karteBauen(); karteAlt = false; }
  else if (karteSichtbar && karte) setTimeout(() => karte.invalidateSize(), 50);
}

function datum(zeit) {
  return new Date(zeit).toLocaleString("de-DE",
    { day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit" });
}

function antwortenHtml(e) {
  return fragen.map(function(f, i) {
    const a = e.antworten[i] == null ? "keine Angabe" : e.antworten[i];
    return "<b>" + f + ":</b> " + a;
  }).join(" &middot; ");
}

function fotosHtml(e, klasse) {
  if (!e.fotos || e.fotos.length === 0) return "";
  return '<div class="' + klasse + '">' +
    e.fotos.map(f => '<img src="' + f + '" alt="Foto" loading="lazy">').join("") +
    '</div>';
}

function standortText(e) {
  if (e.adresse && e.adresse.trim() !== "") return e.adresse;
  if (e.breite != null && e.laenge != null)
    return "Koordinaten: " + e.breite.toFixed(5) + ", " + e.laenge.toFixed(5);
  return "ohne Standort";
}

function filterBauen() {
  const div = document.getElementById("filter");
  let html = "";
  fragen.forEach(function(f, i) {
    const wert = filter[i];
    const label = wert == null ? f : f + ": " + wert;
    html += '<div class="fmenue">' +
      '<button class="fchip' + (wert != null ? " aktiv" : "") + '" onclick="filterMenue(' + i + ')">' +
        label + '<span class="pfeil">&#9662;</span></button>' +
      '<div id="fpanel' + i + '" class="fpanel">' +
        '<button class="foption' + (wert == null ? " aktiv" : "") + '" ' +
          'onclick="filterWaehlen(' + i + ',null)">beliebig</button>' +
        antworten[i].map(function(a) {
          return '<button class="foption' + (wert === a ? " aktiv" : "") + '" ' +
            'onclick="filterWaehlen(' + i + ',\'' + a + '\')">' + a + '</button>';
        }).join("") +
      '</div></div>';
  });
  if (filter.some(w => w != null))
    html += '<button class="fleeren" onclick="filterLeeren()">&#10005;&nbsp;alle löschen</button>';
  if (eintraege.length > 0)
    html += '<span class="fzaehler">' + eintraege.filter(passt).length +
      " von " + eintraege.length + " Einträgen</span>";
  div.innerHTML = html;
}

function filterMenue(i) {
  const panel = document.getElementById("fpanel" + i);
  const warOffen = panel.className.indexOf("offen") >= 0;
  allePanelsZu();
  if (!warOffen) panel.className = "fpanel offen";
}

function allePanelsZu() {
  fragen.forEach(function(f, i) {
    const p = document.getElementById("fpanel" + i);
    if (p) p.className = "fpanel";
  });
}

function filterWaehlen(i, antwort) {
  filter[i] = antwort;
  allePanelsZu();
  filterBauen();
  listeBauen();
  karteAktualisieren();
}

function filterLeeren() {
  filter = [null, null, null];
  filterBauen();
  listeBauen();
  karteAktualisieren();
}

function karteAktualisieren() {
  if (!karte) return;  // Karte gibt es noch nicht – sie wird beim Anzeigen frisch gebaut
  if (document.getElementById("karte").style.display === "none") { karteAlt = true; return; }
  karteBauen();
}

document.addEventListener("click", function(e) {
  if (e.target && e.target.closest && !e.target.closest(".fmenue")) allePanelsZu();
});

function passt(e) {
  for (let i = 0; i < fragen.length; i++) {
    if (filter[i] != null && e.antworten[i] !== filter[i]) return false;
  }
  return true;
}

function listeBauen() {
  const div = document.getElementById("liste");
  const sichtbar = eintraege.filter(passt);
  if (eintraege.length === 0) {
    div.className = "leer";
    div.textContent = "Noch keine Einträge – sobald die App sichert, erscheinen sie hier.";
    return;
  }
  if (sichtbar.length === 0) {
    div.className = "leer";
    div.textContent = "Keine Einträge mit diesen Filtern.";
    return;
  }
  div.className = "";
  div.innerHTML = sichtbar.map(e =>
    '<div class="karte-eintrag">' +
      '<div class="datum">' + datum(e.zeit) + '</div>' +
      '<div class="adresse">' + standortText(e) + '</div>' +
      fotosHtml(e, "fotos") +
      '<div class="angaben">' + antwortenHtml(e) + '</div>' +
      (e.freitext ? '<div class="freitext">' + e.freitext + '</div>' : "") +
    '</div>').join("");
}

function karteBauen() {
  if (karte) { karte.remove(); karte = null; }
  karte = L.map("map").setView([51.16, 10.45], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(karte);
  const punkte = [];
  eintraege.filter(passt).forEach(e => {
    if (e.breite == null || e.laenge == null) return;
    const popup =
      '<div class="datum">' + datum(e.zeit) + '</div>' +
      '<div>' + standortText(e) + '</div>' +
      '<div class="popup-fotos">' +
        (e.fotos ? e.fotos.map(f => '<img src="' + f + '" alt="Foto">').join("") : "") +
      '</div>' +
      '<div>' + (e.freitext ? e.freitext.slice(0, 120) : "") + '</div>';
    L.marker([e.breite, e.laenge]).addTo(karte)
      .bindPopup(popup, { maxWidth: 260 });
    punkte.push([e.breite, e.laenge]);
  });
  if (punkte.length > 0) karte.fitBounds(punkte, { padding: [40, 40], maxZoom: 16 });
}

fetch("eintraege.json")
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(daten => {
    eintraege = Array.isArray(daten) ? daten : [];
    eintraege.sort((a, b) => b.zeit - a.zeit);
    filterBauen();
    listeBauen();
    zeige(location.hash === "#karte" ? "karte" : "liste");
  })
  .catch(() => {
    const div = document.getElementById("liste");
    div.className = "leer";
    div.textContent = "Noch keine Einträge – sobald die App sichert, erscheinen sie hier.";
    zeige(location.hash === "#karte" ? "karte" : "liste");
  });
</script>
</body>
</html>
